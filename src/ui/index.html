<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Codex 残り使用量</title>
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <main>
    <header><div class="brand"><span class="mark" aria-hidden="true">C</span><span>Codex <small>残り使用量</small></span></div><button id="quit" class="icon" title="終了" aria-label="終了">×</button></header>
    <div id="status" role="status" aria-live="polite">使用量を取得中…</div>
    <section class="quota" data-window="fiveHour" aria-label="5時間の利用枠">
      <div class="quota-heading"><span>5時間枠</span><strong class="value">—</strong></div>
      <div class="track" role="progressbar" aria-label="5時間枠の残り割合" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div>
      <div class="reset">リセット時刻：不明</div>
    </section>
    <section class="quota" data-window="weekly" aria-label="7日間の利用枠">
      <div class="quota-heading"><span>7日間枠</span><strong class="value">—</strong></div>
      <div class="track" role="progressbar" aria-label="7日間枠の残り割合" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div>
      <div class="reset">リセット時刻：不明</div>
    </section>
    <footer><span id="placement">画面左下</span><div class="actions"><button id="cancel-login" hidden>中止</button><button id="login" hidden>ログイン</button><button id="refresh" title="使用量を再取得">更新</button><button id="mode" title="表示位置を切り替え">位置</button></div></footer>
  </main>
</body>
</html>
