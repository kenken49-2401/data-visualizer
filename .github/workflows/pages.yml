name: Publish online usage viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run install:electron
      - run: npm test
      - name: Validate desktop and mobile browser behavior with encrypted fixtures
        run: xvfb-run -a npm run smoke:web -- --cloud-no-sandbox
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the repository Pages configuration
        uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the public page and its assets
        run: node scripts/verify-web-public.cjs
