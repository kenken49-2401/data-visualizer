name: Verify and release Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['updates/**', 'update.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run install:electron
      - run: npm test
      - name: Validate Windows tracker and accessibility declarations
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('src/windows-tracker.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'Tracker syntax validation failed' }
          $source = Get-Content -Raw 'src/windows-tracker.ps1'
          $native = [regex]::Match($source, "(?s)Add-Type @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          Add-Type -TypeDefinition $native
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
      - name: Run the real Windows visibility helper
        shell: pwsh
        run: ./scripts/test-tracker.ps1
      - run: npm run smoke
      - run: npm run smoke -- --launcher
      - run: npm run smoke -- --staged-update
      - run: npm run smoke -- --rollback-update
      - run: npm run dist:win
      - run: npm run smoke:packaged
      - name: Install and launch the Windows app
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      - name: Release verified installer and update metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          gh release create $env:GITHUB_REF_NAME "dist/Codex-Usage-Overlay-Setup-$version.exe" "dist/Codex-Usage-Overlay-Setup-$version.exe.blockmap" 'dist/latest.yml' --verify-tag --title "Codex Usage Overlay $version" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
